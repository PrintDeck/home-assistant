blueprint:
  name: "PrintDeck: Respond to print events"
  description: "Runs your chosen actions for matching print events from all current and future PrintDeck devices. Each PrintDeck remains a separate source. Calibration jobs are excluded."
  domain: automation
  author: kitek
  homeassistant:
    min_version: 2025.10.0
  input:
    event_types:
      name: "Event types"
      description: "Choose the events that should run the actions."
      default: [started, completed, failed, milestone]
      selector:
        select:
          multiple: true
          options:
            - label: "Print started"
              value: started
            - label: "Print paused"
              value: paused
            - label: "Print resumed"
              value: resumed
            - label: "Print completed"
              value: completed
            - label: "Print failed"
              value: failed
            - label: "Print cancelled"
              value: cancelled
            - label: "Progress milestone"
              value: milestone
            - label: "Attention required"
              value: attention
            - label: "Attention cleared"
              value: attention_cleared
    printdeck_source:
      name: "PrintDeck ID"
      description: "Leave empty to include every PrintDeck, or enter one printdeck_id to filter the source."
      default: ""
      selector:
        text:
    event_actions:
      name: "Actions"
      description: "Use printer_name, printdeck_id, printer_id, job_id, event_type, progress_percent and milestone in action templates."
      default: []
      selector:
        action:

triggers:
  - trigger: event
    event_type: printdeck_event
variables:
  selected_events: !input event_types
  selected_source: !input printdeck_source
conditions:
  - condition: template
    value_template: >-
      {{ trigger.event.data.event_type in selected_events
          and trigger.event.data.job_kind == 'print'
          and (selected_source | trim == '' or trigger.event.data.printdeck_id == selected_source | trim) }}
actions:
  - variables:
      printer_name: "{{ trigger.event.data.printer_name }}"
      printdeck_id: "{{ trigger.event.data.printdeck_id }}"
      printer_id: "{{ trigger.event.data.printer_id }}"
      job_id: "{{ trigger.event.data.job_id }}"
      event_type: "{{ trigger.event.data.event_type }}"
      progress_percent: "{{ trigger.event.data.progress_percent }}"
      milestone: "{{ trigger.event.data.milestone }}"
  - sequence: !input event_actions
mode: queued
max: 50
